# Overa — production stack
# Usage:
#   docker compose up -d --build     # build & start
#   docker compose logs -f app       # follow logs
#   Data persists in the `overa_db` volume (SQLite at /app/db/custom.db).
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: overa-marketplace:latest
    container_name: overa-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/app/db/custom.db
      NEXT_TELEMETRY_DISABLED: "1"
      # SMS provider key enables real OTP delivery; unset = visible demo mode.
      # SMS_PROVIDER_API_KEY: ""
    volumes:
      - overa_db:/app/db
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  overa_db:
