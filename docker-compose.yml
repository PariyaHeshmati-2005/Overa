# Overa — production stack (PostgreSQL)
# Usage:
#   docker compose up -d --build     # build & start
#   docker compose logs -f app       # follow logs
#
# Data persists in the `overa_pg` Postgres volume — listings, users,
# reservations and the wallet ledger survive rebuilds and redeploys.
#
# First-run admin bootstrap (recommended):
#   ADMIN_PHONE=09120000000 ADMIN_PASSWORD=<strong-password> docker compose up -d
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: overa-marketplace:latest
    container_name: overa-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: ${DATABASE_URL:-postgresql://overa:overa_pg_password@db:5432/overa?sslmode=disable}
      DIRECT_URL: ${DIRECT_URL:-postgresql://overa:overa_pg_password@db:5432/overa?sslmode=disable}
      # Public URL used by the PWA QR code (set to your real domain):
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      # Optional first-run admin bootstrap (both required together):
      ADMIN_PHONE: ""
      ADMIN_PASSWORD: ""
      # Demo content is OFF by default. Set to "1" only for demo environments.
      SEED_DEMO: ""
      # SMS provider key enables real OTP delivery; unset = visible demo mode.
      # SMS_PROVIDER_API_KEY: ""
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  db:
    image: postgres:16-alpine
    container_name: overa-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: overa
      POSTGRES_PASSWORD: overa_pg_password
      POSTGRES_DB: overa
    volumes:
      - overa_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U overa -d overa"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  overa_pg:
