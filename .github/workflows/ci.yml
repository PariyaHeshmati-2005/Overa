name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Lint · Type-check · Unit tests · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Lint
        run: bun run lint

      - name: Type-check
        run: bunx tsc --noEmit

      - name: Unit tests
        run: bun test

      - name: Production build
        env:
          DATABASE_URL: file:/tmp/ci.db
          NEXT_TELEMETRY_DISABLED: 1
        run: bun run build

      - name: Smoke-test production server
        env:
          DATABASE_URL: file:/tmp/ci.db
        run: |
          bun run start &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/ -o /dev/null; then
              echo "Home page responded 200"
              kill $SERVER_PID
              exit 0
            fi
            sleep 2
          done
          echo "Server did not respond within 60s"
          kill $SERVER_PID
          exit 1

  schema-check:
    name: Prisma schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Validate schema
        run: bunx prisma validate
        env:
          DATABASE_URL: "file:./dev.db"
