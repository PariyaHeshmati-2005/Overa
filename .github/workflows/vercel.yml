name: Deploy to Vercel (manual)

# The project playbook targets GitHub + Vercel. Vercel auto-deploys when the
# repository is imported in the Vercel dashboard — no token needed.
# This workflow is for CI-driven deploys instead; enable after adding the
# repository variables/secrets listed below. It never runs automatically.

on:
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Pull-request preview / production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Vercel CLI
        run: bun add --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

# Required repository secrets for this workflow:
#   VERCEL_TOKEN        – Vercel personal token (CI scope)
#   VERCEL_ORG_ID       – from `vercel link`
#   VERCEL_PROJECT_ID   – from `vercel link`
# Required environment variables in the Vercel project (Production + Preview):
#   DATABASE_URL        – e.g. a hosted Postgres/SQLite-compatible URL.
#                         NOTE: Vercel's serverless filesystem is ephemeral;
#                         use a hosted database provider for Production.
#   SMS_PROVIDER_API_KEY – optional; unset keeps OTP in labelled demo mode.
